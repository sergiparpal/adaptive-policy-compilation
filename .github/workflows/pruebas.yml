# The suite, on every push and every pull request.
#
# It closes the remote half of "nobody runs the tests automatically"
# (IDEAS.md, technical debt). The local half is `.githooks/pre-commit`, which
# runs the same thing before every commit; this job covers what has already
# been pushed, including what was pushed with `--no-verify`.
#
# It costs zero API calls: the suite calls the measurement functions, never the
# scripts' `main()`.

name: pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancels what has been left behind on the same ref, so as not to spend minutes
# on a commit nobody is going to look at. That is exactly what you want on a PR
# branch: only the last push matters.
#
# WITH ONE EXCEPTION: `main` is NOT cancelled. Commits reach main one after
# another, and the workflow status is the only record that a specific commit
# passed the suite. With a plain `cancel-in-progress: true`, landing three
# commits in a row leaves the first two "cancelled" forever: they did not fail,
# they simply never got to answer. In a repository where reproducibility is the
# product, one green per commit is worth more than the machine seconds
# cancelling saves.
#
# Until August 7, 2026 the premise of this exception was that commits went
# STRAIGHT to main. The ruleset ended that —they arrive by merge now— and the
# exception survives the change because what it protects is the run on main,
# not the route the commit took to get there.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  suite:
    runs-on: ubuntu-latest
    # The suite takes ~45 s. Ten minutes is not a speed target: it is the cap
    # that turns a hung job —a download that does not answer, a
    # test_order_determinism subprocess that never finishes— into a failure
    # instead of six hours of runner.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Two interpreters, each answering a claim the repo makes: 3.12 is the
        # one that produced the records (header of requirements.lock.txt:
        # "Python 3.12.3 · Linux x86_64") and 3.10 the minimum the README
        # declares.
        python: ["3.10", "3.12"]

    steps:
      # Pinned to the FULL SHA, with the version in a comment alongside. A tag
      # can be repointed by its owner at other code; a commit cannot. It is the
      # convention of the rest of the repositories in this account and it was
      # missing here: this workflow spent a day on `@v7`.
      #
      # The majors, moreover, are not cosmetic: until recently this used
      # checkout@v4 and setup-python@v5, which declare `using: node20`, already
      # deprecated, and GitHub warned on every run.
      #
      # To bump them: resolve the new tag to its commit
      #   gh api repos/actions/checkout/commits/vX.Y.Z --jq .sha
      # and change SHA and comment together. A test checks they travel as one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Nothing installed, on purpose: the suite runs on the standard library
      # and that it stays that way is part of what is checked. Without `openai`
      # installed, the test comparing the live version with the pin is skipped,
      # just as locally without the venv.
      - name: la suite
        run: python -m unittest discover

      # The suite declares that it does not write to results*/. Here it is
      # checked instead of believed: if one day a test calls a `main()` that
      # dumps its JSON, it shows up here and not when somebody commits the
      # trampled record.
      - name: los registros siguen intactos
        run: |
          sucio="$(git status --porcelain -- results results2 results3 results4)"
          if [ -n "$sucio" ]; then
            echo "la suite ha escrito en results*/:"
            echo "$sucio"
            exit 1
          fi

  # ONE stable check name for the branch ruleset to require. The matrix legs
  # come and go —the floor moves when the minimum the README declares moves— so
  # requiring `suite (3.10)` directly would turn a dropped version into a
  # required check that never reports again, and an unsatisfiable required
  # check blocks every merge forever. This job depends on the ones that must
  # pass and fails unless all of them succeeded.
  #
  # THE NAME IS LOAD-BEARING: the repository ruleset requires the context
  # `ci-complete` literally. Renaming this job without changing the ruleset
  # blocks every PR, silently and forever. It is the same pattern as the rest
  # of the repositories in this account, and there is a test that checks the
  # job is still here.
  ci-complete:
    if: always()
    needs: [suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required job did not succeed:"
          echo '${{ toJSON(needs) }}'
          exit 1
