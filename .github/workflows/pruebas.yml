# La suite, en cada push y en cada pull request.
#
# Cierra la mitad remota de "nadie corre las pruebas automaticamente"
# (IDEAS.md, deuda tecnica). La mitad local es `.githooks/pre-commit`, que
# corre lo mismo antes de cada commit; este trabajo cubre lo que ya se empujo,
# incluido lo que se empujo con `--no-verify`.
#
# Cuesta cero llamadas a la API: la suite llama a las funciones de medida,
# nunca a los `main()` de los scripts.

name: pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancela lo que ya ha quedado atras en la misma referencia, para no gastar
# minutos en un commit que nadie va a mirar.
#
# CON UNA EXCEPCION: `main` NO se cancela. Aqui los commits van directos a main,
# uno detras de otro, y el estado del flujo es el unico registro de que un
# commit concreto paso la suite. Con `cancel-in-progress: true` a secas, empujar
# tres commits seguidos deja los dos primeros en "cancelled" para siempre: no
# fallaron, es que nunca llegaron a responder. En un repositorio donde la
# reproducibilidad es el producto, un verdadero por commit vale mas que los
# segundos de maquina que ahorra cancelarlo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  suite:
    runs-on: ubuntu-latest
    # La suite tarda ~45 s. Diez minutos no es un objetivo de velocidad: es el
    # tope que convierte un trabajo colgado —una descarga que no responde, un
    # subproceso de test_order_determinism que no termina— en un fallo en vez de
    # en seis horas de runner.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Dos interpretes, y cada uno responde a una afirmacion del repo: 3.12
        # es el que produjo los registros (cabecera de requirements.lock.txt:
        # "Python 3.12.3 · Linux x86_64") y 3.10 el minimo que declara el
        # README.
        python: ["3.10", "3.12"]

    steps:
      # Clavadas al SHA COMPLETO, con la version en un comentario al lado. Una
      # etiqueta la puede repuntar su dueño hacia otro codigo; un commit no. Es
      # la convencion del resto de repositorios de esta cuenta y aqui faltaba:
      # este flujo estuvo en `@v7` durante un dia.
      #
      # Los mayores, ademas, no son cosmeticos: hasta hace poco esto iba en
      # checkout@v4 y setup-python@v5, que declaran `using: node20`, ya
      # deprecado, y GitHub avisaba en cada ejecucion.
      #
      # Para subirlas: resolver la etiqueta nueva a su commit
      #   gh api repos/actions/checkout/commits/vX.Y.Z --jq .sha
      # y cambiar SHA y comentario a la vez. Una prueba comprueba que van juntos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Sin instalar nada, a proposito: la suite corre con la biblioteca
      # estandar y que siga siendo asi es parte de lo que se comprueba. Sin
      # `openai` instalado, la prueba que compara la version viva con el pin se
      # salta, igual que en local sin venv.
      - name: la suite
        run: python -m unittest discover

      # La suite declara que no escribe en results*/. Aqui se comprueba en vez
      # de creerselo: si algun dia una prueba llama a un `main()` que vuelca su
      # JSON, se ve aqui y no cuando alguien confirme el registro pisado.
      - name: los registros siguen intactos
        run: |
          sucio="$(git status --porcelain -- results results2 results3 results4)"
          if [ -n "$sucio" ]; then
            echo "la suite ha escrito en results*/:"
            echo "$sucio"
            exit 1
          fi
