# Automatic updates for the CI actions.
#
# WHY IT IS NEEDED. The actions are pinned to the full SHA (see
# .github/workflows/pruebas.yml), which is the right thing —a tag can be
# repointed by its owner at other code, a commit cannot— but it has a cost: a
# SHA does not age noisily. It sits still and silent while the action publishes
# new versions, and the pin ends up a fossil instead of a choice. This turns
# that silence into a weekly PR. Dependabot rewrites the SHA and its
# `# vX.Y.Z` comment together, which is exactly what
# `tests/test_automatizacion.py` requires.
#
# WHY ONLY `github-actions`, AND NOT `pip`. There is a `requirements.txt` and a
# `requirements.lock.txt` here, so unlike the other repositories in this account
# the pip ecosystem would have material to resolve. It is left out on purpose:
# `openai==2.53.0` and the lock's transitive closure are not an outdated
# dependency, they are the PROVENANCE of the environment that produced the
# records. Bumping that pin is not routine maintenance —it changes the
# environment the lock promises to rebuild to the digit— and it is a decision
# that comes with re-running the run or noting the change. A weekly PR
# proposing it would train the habit of merging without looking, which is
# exactly the carelessness the lock exists to prevent.
#
# Security alerts are a different thing and do not come from this file: they
# depend on the repository configuration, not on `updates:`.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
