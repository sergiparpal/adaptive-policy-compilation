# Actualizaciones automaticas de las acciones de CI.
#
# POR QUE HACE FALTA. Las acciones van clavadas al SHA completo (ver
# .github/workflows/pruebas.yml), que es lo correcto —una etiqueta la puede
# repuntar su dueño hacia otro codigo, un commit no— pero tiene un coste: un
# SHA no envejece ruidosamente. Se queda quieto y en silencio mientras la accion
# publica versiones nuevas, y el pin acaba siendo un fosil en vez de una
# eleccion. Esto convierte ese silencio en un PR semanal. Dependabot reescribe
# el SHA y su comentario `# vX.Y.Z` a la vez, que es justo lo que exige
# `tests/test_automatizacion.py`.
#
# POR QUE SOLO `github-actions`, Y NO `pip`. Aqui hay `requirements.txt` y
# `requirements.lock.txt`, asi que a diferencia de los otros repositorios de
# esta cuenta el ecosistema pip si tendria material que resolver. Se deja fuera
# a proposito: `openai==2.53.0` y el cierre transitivo del lock no son una
# dependencia desactualizada, son la PROCEDENCIA del entorno que produjo los
# registros. Subir ese pin no es mantenimiento rutinario —cambia el entorno que
# el lock promete reconstruir al digito— y es una decision que va acompañada de
# re-correr la tirada o de anotar el cambio. Un PR semanal proponiendolo
# entrenaria a fusionarlo sin mirar, que es exactamente el descuido que el lock
# existe para impedir.
#
# Las alertas de seguridad son otra cosa y no salen de este archivo: dependen de
# la configuracion del repositorio, no de `updates:`.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
